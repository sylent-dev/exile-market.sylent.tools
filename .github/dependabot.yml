# Weekly pull requests to update the npm packages and the GitHub Actions; the minor and patch
# updates of npm come grouped in one pull request, and every update of Stylelint and its standard
# config comes in a pull request of its own, the two together, since each major version of one
# needs the same of the other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      stylelint:
        patterns: [stylelint, stylelint-config-standard]
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
