# Builds the site and deploys it to GitHub Pages on every push to main, that is when a pull
# request is merged, and every night, so that a new version of the application shows on the patch
# notes the next day at the latest; the button Run workflow publishes it at once (docs/technical-
# choices.md, Patch notes). From the Astro guide: https://docs.astro.build/en/guides/deploy/github/
name: Deploy

on:
  push:
    branches: [main]
  # Every day at 04:17 UTC, off the start of the hour, which GitHub says is the busiest.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The template repository itself has no site to publish; a repository made from it does.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The patch notes are read from the repository of the application, beside this one as on
      # the owner's computer, with its tags, which tell the versions released (docs/technical-
      # choices.md, Patch notes); the history comes without the former contents of its files.
      - run: git clone --quiet --filter=blob:none https://github.com/sylent-dev/rust-exile-market.git ../rust-exile-market
      - uses: withastro/action@v6
        with:
          node-version: 24 # The version of .nvmrc, which the action can't read.
        # Until the domain points to GitHub Pages, the site is checked at its github.io address,
        # under a base path: set the repository variables SITE_URL (https://<owner>.github.io)
        # and BASE_PATH (/<repository>), and delete them at the launch (docs/technical-choices.md,
        # Deployment). Unset, the site is built for the address of astro.config.mjs.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  # Only the job that publishes may write to GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
